---
# Generated By: Cursor (Claude Sonnet 4)
# NTP daemon installation and configuration

- name: Install NTP packages
  ansible.builtin.dnf:
    name: "{{ ntpd_packages }}"
    state: present
  become: true
  register: ntpd_package_install

- name: Configure NTP servers
  ansible.builtin.template:
    src: ntp.conf.j2
    dest: /etc/ntp.conf
    owner: root
    group: root
    mode: '0644'
    backup: true
  become: true
  register: ntpd_config_result
  notify: Restart ntpd

- name: Start and enable NTP service
  ansible.builtin.systemd:
    name: "{{ ntpd_service }}"
    state: started
    enabled: true
  become: true
  register: ntpd_service_result

- name: Add NTP service to firewall
  ansible.posix.firewalld:
    service: "{{ ntpd_firewall_service }}"
    permanent: true
    state: enabled
  become: true
  register: ntpd_firewall_result
  notify: Reload firewall
