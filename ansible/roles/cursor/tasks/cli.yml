---
# Generated By: Cursor (Claude Sonnet 4.5)
# Cursor CLI (cursor-agent) installation

- name: Check if Cursor CLI is installed
  ansible.builtin.command: cursor-agent --version
  register: cursor_cli_check
  failed_when: false
  changed_when: false
  when: cursor_install_cli | default(true)

- name: Determine if pinning to specific version
  ansible.builtin.set_fact:
    cursor_agent_pin_version: "{{ cursor_agent_version | default('latest') != 'latest' }}"
  when: cursor_install_cli | default(true)

- name: Determine if installation is needed
  ansible.builtin.set_fact:
    cursor_cli_needs_install: "{{ cursor_cli_check.rc != 0 or (cursor_agent_pin_version and cursor_agent_version not in (cursor_cli_check.stdout | default(''))) }}"
  when: cursor_install_cli | default(true)

- name: Display current cursor-agent status
  ansible.builtin.debug:
    msg: >-
      Current: {{ cursor_cli_check.stdout | default('not installed') }}
      | Desired: {{ cursor_agent_version | default('latest') }}
      | Pinned: {{ cursor_agent_pin_version }}
      | Install needed: {{ cursor_cli_needs_install | default(false) }}
  when: cursor_install_cli | default(true)

- name: Download official Cursor CLI installer script
  ansible.builtin.get_url:
    url: https://cursor.com/install
    dest: /tmp/cursor-cli-install-original.sh
    mode: '0644'
  register: cursor_cli_download
  when:
    - cursor_install_cli | default(true)
    - cursor_cli_needs_install

- name: Get current version from installer script (for pinned version)
  ansible.builtin.shell: |
    grep -oP '(?<=versions/)[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[a-f0-9]+' /tmp/cursor-cli-install-original.sh | head -1
  register: installer_current_version
  changed_when: false
  when:
    - cursor_install_cli | default(true)
    - cursor_cli_download is succeeded
    - cursor_agent_pin_version

- name: Modify installer script to use pinned version
  ansible.builtin.shell: |
    sed "s/{{ installer_current_version.stdout }}/{{ cursor_agent_version }}/g" \
      /tmp/cursor-cli-install-original.sh > /tmp/cursor-cli-install.sh
    chmod +x /tmp/cursor-cli-install.sh
  when:
    - cursor_install_cli | default(true)
    - cursor_cli_download is succeeded
    - cursor_agent_pin_version
    - installer_current_version.stdout is defined

- name: Use unmodified installer for latest version
  ansible.builtin.copy:
    src: /tmp/cursor-cli-install-original.sh
    dest: /tmp/cursor-cli-install.sh
    mode: '0755'
    remote_src: yes
  when:
    - cursor_install_cli | default(true)
    - cursor_cli_download is succeeded
    - not cursor_agent_pin_version

- name: Execute Cursor CLI installer
  ansible.builtin.command: /tmp/cursor-cli-install.sh
  register: cursor_cli_install
  failed_when: cursor_cli_install.rc != 0
  changed_when: cursor_cli_install.rc == 0
  when:
    - cursor_install_cli | default(true)
    - cursor_cli_needs_install

- name: Verify Cursor CLI installation
  ansible.builtin.command: cursor-agent --version
  register: cursor_cli_verify
  changed_when: false
  when:
    - cursor_install_cli | default(true)
    - cursor_cli_install is succeeded

- name: Create cursor-agent config directory
  ansible.builtin.file:
    path: ~/.config/cursor-agent
    state: directory
    mode: '0755'
  when: cursor_install_cli | default(true)

- name: Write pinned version config
  ansible.builtin.copy:
    content: "{{ cursor_agent_version }}"
    dest: ~/.config/cursor-agent/pinned-version
    mode: '0644'
  when:
    - cursor_install_cli | default(true)
    - cursor_agent_pin_version

- name: Remove pinned version config (for latest)
  ansible.builtin.file:
    path: ~/.config/cursor-agent/pinned-version
    state: absent
  when:
    - cursor_install_cli | default(true)
    - not cursor_agent_pin_version

- name: Log CLI installation result
  ansible.builtin.debug:
    msg: "Cursor CLI {{ cursor_agent_version }} installed successfully: {{ cursor_cli_verify.stdout }}{{ ' (pinned via bashrc alias)' if cursor_agent_pin_version else '' }}"
  when:
    - cursor_install_cli | default(true)
    - cursor_cli_verify is defined
    - cursor_cli_verify.stdout is defined

- name: Clean up installer scripts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/cursor-cli-install-original.sh
    - /tmp/cursor-cli-install.sh
  when: cursor_cli_download is defined
