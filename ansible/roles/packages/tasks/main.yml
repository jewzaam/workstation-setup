---
# Generated By: Cursor (Claude Sonnet 4)
# Package installation tasks

- name: Update package cache
  ansible.builtin.dnf:
    update_cache: true
  become: true

- name: Install essential packages via dnf
  ansible.builtin.dnf:
    name: "{{ essential_packages }}"
    state: present
  become: true
  register: packages_package_install_result

- name: Enable flathub remote
  ansible.builtin.command:
    cmd: flatpak remote-modify --enable flathub
  become: true
  register: flathub_enable_result
  changed_when: flathub_enable_result.rc == 0
  failed_when: false

- name: Install Obsidian via flatpak
  community.general.flatpak:
    name: md.obsidian.Obsidian
    state: present
    remote: flathub
