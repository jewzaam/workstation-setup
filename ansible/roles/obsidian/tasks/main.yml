---
# Generated By: Cursor (Claude Sonnet 4)
# Obsidian installation via flatpak

- name: Enable flathub remote
  ansible.builtin.command:
    cmd: flatpak remote-modify --enable flathub
  become: true
  register: obsidian_flathub_enable_result
  changed_when: obsidian_flathub_enable_result.rc == 0
  failed_when: false

- name: Install Obsidian via flatpak
  community.general.flatpak:
    name: "{{ obsidian_flatpak_name }}"
    state: present
    remote: "{{ obsidian_flatpak_remote }}"
